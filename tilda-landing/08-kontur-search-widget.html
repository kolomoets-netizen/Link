<!-- Tilda block: Kontur.Закупки — отсев «только поиск» (iframe) -->
<style>
  .tg-kontur-wrap {
    --tg-primary: #1c50de;
    --tg-text: #0f172a;
    --tg-muted: #64748b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    width: 100%;
    background: #fff;
    padding: 64px 24px 72px;
  }
  .tg-kontur-wrap *, .tg-kontur-wrap *::before, .tg-kontur-wrap *::after { box-sizing: border-box; }
  .tg-kontur-inner { max-width: 1120px; margin: 0 auto; }

  .tg-kontur-search-head {
    text-align: center;
    margin-bottom: 28px;
  }
  .tg-kontur-search-head h2,
  .tg-kontur-crm h2 {
    margin: 0 0 12px;
    font-size: clamp(28px, 3.5vw, 40px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--tg-text);
    line-height: 1.15;
  }
  .tg-kontur-search-head p {
    margin: 0 auto;
    max-width: 640px;
    font-size: 17px;
    line-height: 1.6;
    color: var(--tg-muted);
  }
  .tg-kontur-brand {
    color: var(--tg-primary);
    font-weight: 600;
  }

  .tg-kontur-iframe {
    display: block;
    width: 100%;
    height: 116px;
    border: 0;
    background: transparent;
    margin-bottom: 36px;
  }

  .tg-kontur-crm {
    text-align: center;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0;
    background: none;
  }
  .tg-kontur-crm-sub {
    margin: 0 auto 32px;
    max-width: 640px;
    font-size: 17px;
    line-height: 1.6;
    color: var(--tg-muted);
  }
  .tg-kontur-crm-sub em {
    font-style: normal;
    color: var(--tg-primary);
    font-weight: 600;
  }
  .tg-kontur-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 17px 36px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, #1c50de 0%, #2f63ea 100%);
    box-shadow: 0 10px 30px rgba(28, 80, 222, 0.28);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .tg-kontur-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(28, 80, 222, 0.34);
  }

  @media (max-width: 640px) {
    .tg-kontur-wrap { padding: 48px 16px 56px; }
    .tg-kontur-iframe { margin-bottom: 28px; }
  }
</style>

<div class="tg-kontur-wrap" id="kontur-search">
  <div class="tg-kontur-inner">
    <div class="tg-kontur-search-head">
      <h2>Нужен только поиск тендеров?</h2>
      <p>Ищите закупки у нашего партнера <span class="tg-kontur-brand">Контур.Закупки</span>.</p>
    </div>

    <iframe
      class="tg-kontur-iframe"
      src="https://kontur.ru/widget/search/zakupki?p=w55732"
      width="100%"
      height="116"
      title="Поиск закупок Контур.Закупки"
      loading="lazy"
      allowtransparency="true"
    ></iframe>

    <div class="tg-kontur-crm">
      <h2>Нужна система для работы тендерного отдела? —</h2>
      <p class="tg-kontur-crm-sub">
        Оставьте заявку и мы покажем, как система поможет <em>именно вашей компании</em>.
      </p>
      <a
        href="#popup:demo"
        class="tg-kontur-btn"
        id="btn-trading-demo-kontur-block"
        data-ym-goal="TRADING_BTN_DEMO_KONTUR_BLOCK"
      >Запросить демо CRM</a>
    </div>
  </div>
</div>

<script>
(function () {
  var COUNTER_ID = 86511628;
  document.querySelectorAll('#kontur-search [data-ym-goal]').forEach(function (el) {
    el.addEventListener('click', function () {
      var goal = el.getAttribute('data-ym-goal');
      if (goal && typeof ym === 'function') {
        ym(COUNTER_ID, 'reachGoal', goal);
      }
    });
  });
})();
</script>
