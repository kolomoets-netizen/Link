<!-- Tilda block: Kontur.Закупки — отсев «только поиск» (iframe) -->
<style>
  .tg-kontur-wrap {
    --tg-primary: #1c50de;
    --tg-text: #0f172a;
    --tg-muted: #64748b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    width: 100%;
    background: #fff;
    padding: 64px 24px 72px;
  }
  .tg-kontur-wrap *, .tg-kontur-wrap *::before, .tg-kontur-wrap *::after { box-sizing: border-box; }
  .tg-kontur-inner { max-width: 1120px; margin: 0 auto; }

  .tg-kontur-search-head {
    text-align: center;
    margin-bottom: 28px;
  }
  .tg-kontur-search-head h2 {
    margin: 0 0 12px;
    font-size: clamp(28px, 3.5vw, 40px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--tg-text);
    line-height: 1.15;
  }
  .tg-kontur-search-head p {
    margin: 0 auto;
    max-width: 640px;
    font-size: 17px;
    line-height: 1.6;
    color: var(--tg-muted);
  }

  .tg-kontur-iframe {
    display: block;
    width: 100%;
    height: 116px;
    border: 0;
    background: transparent;
    margin-bottom: 48px;
  }

  .tg-kontur-crm {
    text-align: center;
  }
  .tg-kontur-crm h3 {
    margin: 0 0 20px;
    font-size: clamp(22px, 2.8vw, 32px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--tg-text);
    line-height: 1.2;
  }
  .tg-kontur-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, #1c50de 0%, #2f63ea 100%);
    box-shadow: 0 10px 30px rgba(28, 80, 222, 0.28);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .tg-kontur-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 36px rgba(28, 80, 222, 0.34);
  }

  @media (max-width: 640px) {
    .tg-kontur-wrap { padding: 48px 16px 56px; }
    .tg-kontur-iframe { margin-bottom: 40px; }
  }
</style>

<div class="tg-kontur-wrap" id="kontur-search">
  <div class="tg-kontur-inner">
    <div class="tg-kontur-search-head">
      <h2>Нужен только поиск тендеров?</h2>
      <p>Ищите закупки у нашего партнера Контур.Закупки.</p>
    </div>

    <iframe
      class="tg-kontur-iframe"
      src="https://kontur.ru/widget/search/zakupki?p=w55732"
      width="100%"
      height="116"
      title="Поиск закупок Контур.Закупки"
      loading="lazy"
      allowtransparency="true"
    ></iframe>

    <div class="tg-kontur-crm">
      <h3>Нужна система для работы тендерного отдела?</h3>
      <a href="#demo" class="tg-kontur-btn">Запросить демо CRM</a>
    </div>
  </div>
</div>
